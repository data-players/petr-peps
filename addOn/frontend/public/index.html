<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="SemApps admin interface"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://unpkg.com/react-leaflet-markercluster@3.0.0-rc1/dist/styles.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/react-mde@11.5.0/lib/styles/css/react-mde-all.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.7.2/main.min.css" />
    <title>Petr Peps</title>
    <script>
      (function () {
        var events = [];
        window.__tokenEvents = events;
        var DIAG_URL = 'https://data.petr-peps.data-players.com/__diag';
        function send(evt) {
          try {
            fetch(DIAG_URL, { method: 'POST', body: JSON.stringify(evt), keepalive: true }).catch(function () {});
          } catch (e) {}
        }
        function log(type, key, extra, stack) {
          var evt = { t: type, key: key, url: location.href, ua: navigator.userAgent, ts: Date.now() };
          if (extra) evt.extra = extra;
          var msg = '[TOKEN-DIAG] ' + type + ' key=' + key + ' url=' + location.href + (extra || '');
          console.log(msg);
          if (stack) {
            console.log(stack);
            evt.stack = String(stack);
          }
          events.push(evt);
          send(evt);
        }
        try {
          log('INIT', 'token-present=' + (localStorage.getItem('token') !== null));
        } catch (e) {}
        var origSet = Storage.prototype.setItem;
        var origRemove = Storage.prototype.removeItem;
        var origClear = Storage.prototype.clear;
        Storage.prototype.setItem = function (key, value) {
          log('SET', key, ' len=' + String(value).length, new Error().stack);
          return origSet.call(this, key, value);
        };
        Storage.prototype.removeItem = function (key) {
          log('REMOVE', key, '', new Error().stack);
          return origRemove.call(this, key);
        };
        Storage.prototype.clear = function () {
          var hadToken = localStorage.getItem('token');
          log('CLEAR', '*', '', new Error().stack);
          var r = origClear.call(this);
          if (hadToken !== null) {
            origSet.call(this, 'token', hadToken);
            log('RESTORE', 'token');
          }
          return r;
        };
        window.addEventListener('storage', function (e) {
          log('STORAGE_EVENT', e.key, ' new=' + String(e.newValue).substring(0, 20) + ' old=' + String(e.oldValue).substring(0, 20));
        });
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
