    <title>Petr Peps</title>
    <script>
      (function () {
        var events = [];
        window.__tokenEvents = events;
        function log(type, key, extra) {
          var msg = '[TOKEN-DIAG] ' + type + ' key=' + key + ' url=' + location.href + (extra || '');
          console.log(msg);
          console.log(new Error().stack);
          events.push({ t: type, key: key, url: location.href, stack: new Error().stack });
        }
        try {
          log('INIT', 'token-present=' + (localStorage.getItem('token') !== null));
        } catch (e) {}
        var origSet = Storage.prototype.setItem;
        var origRemove = Storage.prototype.removeItem;
        var origClear = Storage.prototype.clear;
        Storage.prototype.setItem = function (key, value) {
          if (key === 'token') log('SET', key, ' len=' + String(value).length);
          return origSet.call(this, key, value);
        };
        Storage.prototype.removeItem = function (key) {
          if (key === 'token') log('REMOVE', key);
          return origRemove.call(this, key);
        };
        Storage.prototype.clear = function () {
          log('CLEAR', '*');
          return origClear.call(this);
        };
      })();
    </script>

  <body>

    <div id="root"></div>
  </body>
